name: Issue Detection & Resolution
description: Systematic debugging and problem resolution
use_case: "Bugs, errors, performance issues, unexpected behavior"

agents:
  sequence:
    - name: issue-detective
      description: Investigate and identify root cause of the issue
      timeout: 30m
      required: true

    - name: conditional_fix
      type: conditional
      description: Fix implementation based on issue location
      conditions:
        backend_issue:
          agent: java-backend-developer
          timeout: 40m
        frontend_issue:
          agent: nextjs-react-developer
          timeout: 40m
        full_stack_issue:
          type: parallel
          agents:
            - java-backend-developer
            - nextjs-react-developer
          timeout: 50m

    - name: code-reviewer
      description: Review the fix for completeness and side effects
      timeout: 15m
      required: true

    - name: e2e-test-architect
      description: Test the fix and run regression tests
      timeout: 25m
      required: true

context:
  template: |
    # Issue: {{task_description}}
    Type: debug-issue
    Started: {{timestamp}}
    Priority: {{priority|default('medium')}}

    ## 1. Investigation (issue-detective)
    Status: ⏳ Pending

    ## 2. Root Cause Analysis
    Status: ⏳ Pending

    ## 3. Fix Implementation
    Status: ⏳ Pending

    ## 4. Code Review (code-reviewer)
    Status: ⏳ Pending

    ## 5. Regression Testing (e2e-test-architect)
    Status: ⏳ Pending

examples:
  - "API returns 500 errors on user login"
  - "Dashboard loads very slowly (>5 seconds)"
  - "User data not saving correctly"
  - "Authentication tokens expiring too quickly"
  - "Mobile app crashes on file upload"