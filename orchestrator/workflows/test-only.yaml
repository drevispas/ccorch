name: Testing Suite
description: Comprehensive testing without implementation changes
use_case: "Pre-deployment testing, regression testing, quality validation"

agents:
  sequence:
    - name: e2e-test-architect
      description: Design and execute comprehensive test scenarios
      timeout: 45m
      required: true

    - name: conditional_investigation
      type: conditional
      description: Investigate any test failures
      condition: test_failures_found
      agents:
        - name: issue-detective
          description: Analyze test failures and identify issues
          timeout: 20m

        - name: code-reviewer
          description: Review test results and provide recommendations
          timeout: 15m

context:
  template: |
    # Testing: {{task_description}}
    Type: test-only
    Started: {{timestamp}}
    Scope: {{test_scope|default('full_regression')}}

    ## 1. Test Planning & Execution (e2e-test-architect)
    Status: ⏳ Pending

    ## 2. Test Results Analysis
    Status: ⏳ Pending

    ## 3. Issue Investigation (if needed)
    Status: ⏳ Pending

    ## 4. Quality Report
    Status: ⏳ Pending

examples:
  - "Test checkout flow before deployment"
  - "Validate all user authentication scenarios"
  - "Run performance tests on API endpoints"
  - "Test mobile responsiveness across devices"
  - "Validate accessibility compliance"