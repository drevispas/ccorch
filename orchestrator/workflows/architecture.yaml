name: Architecture Design
description: System design and architectural planning
use_case: "Major system changes, new service design, technology decisions"

agents:
  sequence:
    - name: backend-architect
      description: Design system architecture and technical approach
      timeout: 45m
      required: true

    - name: code-reviewer
      description: Review architectural decisions and identify risks
      timeout: 20m
      required: true

context:
  template: |
    # Architecture: {{task_description}}
    Type: architecture
    Started: {{timestamp}}
    Scope: {{scope|default('system_design')}}

    ## 1. System Design (backend-architect)
    Status: ⏳ Pending

    ## 2. Architecture Review (code-reviewer)
    Status: ⏳ Pending

    ## 3. Implementation Plan
    Status: ⏳ Pending

examples:
  - "Design microservice architecture for user management"
  - "Plan database schema for multi-tenant application"
  - "Design caching strategy for high-traffic API"
  - "Architecture for real-time notification system"
  - "Design event-driven architecture for order processing"