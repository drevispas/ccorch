name: Backend-Only Modification
description: Backend changes without frontend modifications
use_case: "API modifications, service improvements, database changes"

agents:
  sequence:
    - name: backend-architect
      description: Design backend approach and architecture changes
      timeout: 20m
      required: true

    - name: java-backend-developer
      description: Implement backend changes
      timeout: 45m
      required: true

    - name: code-reviewer
      description: Review backend implementation
      timeout: 15m
      required: true

context:
  template: |
    # Task: {{task_description}}
    Type: backend-only
    Started: {{timestamp}}

    ## 1. Backend Architecture (backend-architect)
    **Role**: Create design artifacts and specifications
    **Output**: Design document saved as `design-[feature-name].md`
    **Focus**: Architecture, API specs, data models, implementation plan
    Status: ⏳ Pending

    ## 2. Backend Implementation (java-backend-developer)
    **Role**: Implement based on architect's design document
    **Input**: Read `design-[feature-name].md` from project root
    **Output**: Working Java code following the specifications
    **Focus**: Code implementation, testing, integration
    Status: ⏳ Pending

    ## 3. Code Review (code-reviewer)
    **Role**: Review implementation against design specifications
    **Input**: Both design document and implemented code
    **Focus**: Design compliance, code quality, best practices
    Status: ⏳ Pending

    ---
    **Workflow Notes:**
    - Architect creates design-only artifacts (no code)
    - Developer implements according to design specifications
    - Reviewer checks implementation matches design intent

examples:
  - "Add caching to user lookup APIs"
  - "Implement database migration for new fields"
  - "Add audit logging to critical operations"
  - "Optimize query performance for reports"
  - "Add new REST endpoints for mobile app"