name: Frontend-Only Update
description: Frontend changes without backend modifications
use_case: "UI improvements, component updates, styling changes"

agents:
  sequence:
    - name: nextjs-react-developer
      description: Implement frontend changes
      timeout: 45m
      required: true

    - name: code-reviewer
      description: Review frontend implementation and accessibility
      timeout: 15m
      required: true

    - name: e2e-test-architect
      description: Test UI changes and user interactions
      timeout: 20m
      required: false

context:
  template: |
    # Task: {{task_description}}
    Type: frontend-only
    Started: {{timestamp}}

    ## 1. Frontend Implementation (nextjs-react-developer)
    Status: ⏳ Pending

    ## 2. Code Review (code-reviewer)
    Status: ⏳ Pending

    ## 3. UI Testing (e2e-test-architect)
    Status: ⏳ Pending

examples:
  - "Redesign dashboard layout for better UX"
  - "Add dark mode toggle to settings"
  - "Improve mobile responsiveness of forms"
  - "Update component styling with new design system"
  - "Add loading states to data tables"