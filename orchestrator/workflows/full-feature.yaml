name: Full Feature Development
description: Complete feature implementation from design to deployment
use_case: "New features requiring both backend and frontend work"

agents:
  sequence:
    - name: backend-architect
      description: Design system architecture, API contracts, and database schema
      timeout: 30m
      required: true

    - name: parallel_implementation
      type: parallel
      agents:
        - name: java-backend-developer
          description: Implement backend services, controllers, and repositories
          timeout: 60m
          required: true

        - name: nextjs-react-developer
          description: Build frontend components and integrate with APIs
          timeout: 60m
          required: true

    - name: code-reviewer
      description: Review implementation for security, performance, and quality
      timeout: 20m
      required: true

    - name: e2e-test-architect
      description: Design and implement comprehensive end-to-end tests
      timeout: 30m
      required: true

context:
  template: |
    # Task: {{task_description}}
    Type: full-feature
    Started: {{timestamp}}

    ## 1. Architecture (backend-architect)
    Status: ⏳ Pending

    ## 2. Backend Implementation (java-backend-developer)
    Status: ⏳ Pending

    ## 3. Frontend Implementation (nextjs-react-developer)
    Status: ⏳ Pending

    ## 4. Code Review (code-reviewer)
    Status: ⏳ Pending

    ## 5. E2E Testing (e2e-test-architect)
    Status: ⏳ Pending

examples:
  - "Add user authentication with JWT tokens"
  - "Implement shopping cart functionality"
  - "Create admin dashboard with user management"
  - "Build file upload and management system"