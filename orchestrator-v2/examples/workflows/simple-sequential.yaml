name: simple-sequential-workflow
version: 1.0.0
description: A simple sequential workflow demonstrating basic task execution
metadata:
  author: orchestrator-v2
  created: 2024-01-01
  tags: [example, sequential]

pipeline:
  - id: stage-1
    type: sequential
    name: Code Review Process
    stages:
      - id: review-task
        type: task
        name: Review Code
        agentName: code-reviewer
        complexity: simple
        params:
          maxIssues: 10
          checkStyle: true

      - id: analyze-task
        type: task
        name: Analyze Architecture
        agentName: backend-architect
        complexity: moderate
        params:
          depth: detailed
          includeMetrics: true

      - id: document-task
        type: task
        name: Generate Documentation
        agentName: code-reviewer
        complexity: simple
        params:
          format: markdown

errorHandling:
  strategy: retry
  maxRetries: 3
  retryDelay: 1000
  backoffMultiplier: 2

timeouts:
  global: 300000
  perTask: 60000