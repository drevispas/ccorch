name: conditional-branching-workflow
version: 1.0.0
description: Workflow with conditional logic and branching paths
metadata:
  author: orchestrator-v2
  created: 2024-01-01
  tags: [example, conditional, decision-tree]

pipeline:
  - id: initial-check
    type: task
    name: Initial Assessment
    agentName: issue-detective
    complexity: simple
    params:
      checkType: quick
      returnScore: true

  - id: quality-branch
    type: conditional
    name: Quality Gate Decision
    condition: "result.score >= 80"
    then:
      id: fast-track
      type: sequential
      name: Fast Track Approval
      stages:
        - id: quick-review
          type: task
          name: Quick Review
          agentName: code-reviewer
          complexity: simple
          params:
            reviewType: automated

        - id: deploy-prep
          type: task
          name: Prepare for Deployment
          agentName: backend-architect
          complexity: simple
          params:
            environment: production

    else:
      id: detailed-review
      type: sequential
      name: Detailed Review Process
      stages:
        - id: deep-analysis
          type: task
          name: Deep Code Analysis
          agentName: code-reviewer
          complexity: complex
          params:
            analysisDepth: comprehensive
            generateReport: true

        - id: refactor-suggestions
          type: task
          name: Generate Refactoring Plan
          agentName: backend-architect
          complexity: moderate
          params:
            suggestImprovements: true

        - id: test-creation
          type: task
          name: Create Missing Tests
          agentName: e2e-test-architect
          complexity: moderate
          params:
            coverage: 80

  - id: final-validation
    type: task
    name: Final Validation
    agentName: code-reviewer
    complexity: simple
    params:
      validateAll: true

errorHandling:
  strategy: fail-fast
  notifyOnError: true

timeouts:
  global: 900000
  perTask: 180000

hooks:
  preExecution: validate-inputs
  postExecution: generate-report
  onError: notify-team