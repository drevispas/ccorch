name: complex-orchestration-workflow
version: 2.0.0
description: Advanced workflow demonstrating all features - parallel, conditional, loop, subworkflow
metadata:
  author: orchestrator-v2
  created: 2024-01-01
  tags: [example, complex, full-featured, production]
  priority: high
  sla: 3600000

pipeline:
  # Stage 1: Initial Setup and Validation
  - id: setup-stage
    type: parallel
    name: Setup and Validation
    stages:
      - id: env-check
        type: task
        name: Environment Check
        agentName: backend-architect
        complexity: simple
        params:
          checks: [database, cache, api, filesystem]

      - id: load-config
        type: task
        name: Load Configuration
        agentName: backend-architect
        complexity: simple
        params:
          source: environment
          validate: true

      - id: auth-setup
        type: task
        name: Setup Authentication
        agentName: backend-architect
        complexity: moderate
        params:
          provider: oauth2
          scopes: [read, write, admin]

  # Stage 2: Data Processing Pipeline
  - id: data-pipeline
    type: sequential
    name: Data Processing Pipeline
    stages:
      - id: fetch-data
        type: task
        name: Fetch Data Sources
        agentName: backend-architect
        complexity: moderate
        params:
          sources: [api, database, stream]
          batchSize: 100

      - id: quality-check
        type: conditional
        name: Data Quality Gate
        condition: "result.dataQuality.score > 0.7"
        then:
          id: process-data
          type: parallel
          name: Process Valid Data
          stages:
            - id: transform-data
              type: loop
              name: Transform Each Batch
              items: "${result.batches}"
              parallel: true
              maxConcurrency: 5
              body:
                id: transform-batch
                type: task
                name: Apply Transformations
                agentName: java-backend-developer
                complexity: complex
                params:
                  transformations: [normalize, enrich, validate]

            - id: analyze-patterns
              type: task
              name: Pattern Analysis
              agentName: issue-detective
              complexity: complex
              params:
                algorithms: [clustering, anomaly-detection, trending]

        else:
          id: data-cleanup
          type: sequential
          name: Data Cleanup Process
          stages:
            - id: identify-issues
              type: task
              name: Identify Data Issues
              agentName: issue-detective
              complexity: moderate
              params:
                deepAnalysis: true

            - id: fix-issues
              type: task
              name: Fix Data Issues
              agentName: java-backend-developer
              complexity: complex
              params:
                autoFix: true
                validateFixes: true

            - id: reprocess
              type: subworkflow
              name: Reprocess Cleaned Data
              workflow: simple-sequential
              params:
                skipValidation: false

  # Stage 3: Business Logic Execution
  - id: business-logic
    type: sequential
    name: Core Business Logic
    stages:
      - id: risk-assessment
        type: task
        name: Risk Assessment
        agentName: backend-architect
        complexity: complex
        params:
          models: [statistical, ml-based, rule-based]
          confidence: 0.95

      - id: decision-tree
        type: conditional
        name: Risk-Based Decision
        condition: "result.riskLevel === 'low'"
        then:
          id: auto-approve
          type: task
          name: Automatic Approval
          agentName: backend-architect
          complexity: simple
          params:
            notifyStakeholders: true

        else:
          id: manual-review
          type: sequential
          name: Manual Review Process
          stages:
            - id: prepare-review
              type: task
              name: Prepare Review Package
              agentName: code-reviewer
              complexity: moderate
              params:
                includeMetrics: true
                generateReport: true

            - id: wait-approval
              type: wait
              name: Wait for Approval
              duration: 300000
              timeout: 600000

            - id: process-decision
              type: task
              name: Process Review Decision
              agentName: backend-architect
              complexity: simple
              params:
                recordDecision: true

  # Stage 4: Result Processing and Delivery
  - id: delivery-stage
    type: parallel
    name: Result Delivery
    maxConcurrency: 10
    stages:
      - id: generate-reports
        type: sequential
        name: Report Generation
        stages:
          - id: executive-report
            type: task
            name: Executive Summary
            agentName: code-reviewer
            complexity: moderate
            params:
              format: pdf
              include: [summary, charts, recommendations]

          - id: technical-report
            type: task
            name: Technical Report
            agentName: backend-architect
            complexity: complex
            params:
              format: html
              include: [details, logs, metrics, traces]

      - id: notifications
        type: loop
        name: Send Notifications
        items: "${config.stakeholders}"
        body:
          id: notify-stakeholder
          type: task
          name: Send Notification
          agentName: backend-architect
          complexity: simple
          params:
            channel: "${item.preferredChannel}"
            template: "${item.template}"

      - id: persist-results
        type: task
        name: Store Results
        agentName: java-backend-developer
        complexity: moderate
        params:
          storage: [database, cache, archive]
          retention: 30d

  # Stage 5: Cleanup and Monitoring Setup
  - id: finalization
    type: sequential
    name: Finalization
    stages:
      - id: cleanup
        type: task
        name: Resource Cleanup
        agentName: backend-architect
        complexity: simple
        params:
          cleanupTemp: true
          releaseLocke: true

      - id: setup-monitoring
        type: task
        name: Setup Monitoring
        agentName: e2e-test-architect
        complexity: moderate
        params:
          alerts: [error-rate, latency, throughput]
          dashboards: [executive, operational, technical]

      - id: schedule-followup
        type: task
        name: Schedule Follow-up
        agentName: backend-architect
        complexity: simple
        params:
          schedule: "0 0 * * *"
          action: health-check

errorHandling:
  strategy: compensate
  compensationWorkflow: error-recovery-workflow
  maxRetries: 3
  retryDelay: 5000
  backoffMultiplier: 2
  deadLetterQueue: true
  notificationChannels: [email, slack, pagerduty]

timeouts:
  global: 3600000
  perTask: 300000
  perStage: 900000

monitoring:
  metrics: true
  tracing: true
  logLevel: info
  sampling: 0.1
  exporters: [prometheus, jaeger, elasticsearch]

resources:
  cpu: 4
  memory: 8192
  disk: 10240
  network: high

scheduling:
  priority: high
  queue: production
  affinity:
    - gpu: false
    - region: us-east-1

hooks:
  preExecution:
    - validate-prerequisites
    - allocate-resources
  postExecution:
    - generate-metrics
    - cleanup-resources
    - send-summary
  onError:
    - capture-diagnostics
    - notify-oncall
    - initiate-recovery
  onSuccess:
    - record-success
    - update-sla-metrics

versioning:
  compatibleWith: ["1.0.0", "1.5.0"]
  migrations:
    from-1.0.0: migration-script-v1
    from-1.5.0: migration-script-v1.5