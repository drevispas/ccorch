<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orchestrator V2 - WebSocket Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #10b981;
        }

        .status-dot.disconnected {
            background: #ef4444;
            animation: none;
        }

        .status-dot.connecting {
            background: #f59e0b;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }

        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .event-log {
            background: #1f2937;
            color: #10b981;
            padding: 15px;
            border-radius: 6px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 13px;
        }

        .event-entry {
            margin-bottom: 8px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            border-left: 3px solid #667eea;
        }

        .event-time {
            color: #9ca3af;
            font-size: 11px;
        }

        .event-type {
            color: #f59e0b;
            font-weight: bold;
        }

        .event-data {
            color: #e5e7eb;
            margin-top: 4px;
            word-wrap: break-word;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .metric-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .metric-label {
            font-size: 0.9rem;
            color: #6b7280;
            margin-top: 5px;
        }

        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 2px solid #e5e7eb;
        }

        .tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #374151;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Orchestrator V2 WebSocket Client</h1>

        <!-- Connection Status -->
        <div class="card">
            <div class="status-bar">
                <div class="status-indicator">
                    <span class="status-dot disconnected" id="statusDot"></span>
                    <span id="statusText">Disconnected</span>
                </div>
                <div>
                    <input type="text" id="wsUrl" value="ws://localhost:3002" style="width: 200px; margin-right: 10px;">
                    <button id="connectBtn" class="btn-primary" onclick="connect()">Connect</button>
                    <button id="disconnectBtn" class="btn-danger" onclick="disconnect()" disabled>Disconnect</button>
                </div>
            </div>
        </div>

        <!-- Workflow Execution -->
        <div class="card">
            <h2>Workflow Execution</h2>

            <div class="tab-container">
                <button class="tab active" onclick="switchTab('simple')">Simple</button>
                <button class="tab" onclick="switchTab('parallel')">Parallel</button>
                <button class="tab" onclick="switchTab('conditional')">Conditional</button>
                <button class="tab" onclick="switchTab('custom')">Custom</button>
            </div>

            <div id="simple-tab" class="tab-content active">
                <p style="margin-bottom: 10px;">Execute a simple sequential workflow:</p>
                <button class="btn-success" onclick="executeSimpleWorkflow()">Execute Simple Workflow</button>
            </div>

            <div id="parallel-tab" class="tab-content">
                <p style="margin-bottom: 10px;">Execute parallel tasks workflow:</p>
                <button class="btn-success" onclick="executeParallelWorkflow()">Execute Parallel Workflow</button>
            </div>

            <div id="conditional-tab" class="tab-content">
                <p style="margin-bottom: 10px;">Execute conditional logic workflow:</p>
                <button class="btn-success" onclick="executeConditionalWorkflow()">Execute Conditional Workflow</button>
            </div>

            <div id="custom-tab" class="tab-content">
                <textarea id="customWorkflow" rows="10" placeholder="Enter custom workflow JSON...">{
  "name": "custom-workflow",
  "version": "1.0.0",
  "pipeline": [
    {
      "id": "task-1",
      "type": "task",
      "name": "Custom Task",
      "agentName": "test-agent"
    }
  ]
}</textarea>
                <button class="btn-success" onclick="executeCustomWorkflow()" style="margin-top: 10px;">Execute Custom Workflow</button>
            </div>
        </div>

        <!-- Subscriptions -->
        <div class="card">
            <h2>Subscriptions</h2>
            <div class="button-group">
                <button class="btn-secondary" onclick="subscribe('workflow:events')">Subscribe to Workflows</button>
                <button class="btn-secondary" onclick="subscribe('task:events')">Subscribe to Tasks</button>
                <button class="btn-secondary" onclick="subscribe('metrics')">Subscribe to Metrics</button>
                <button class="btn-secondary" onclick="unsubscribeAll()">Unsubscribe All</button>
            </div>
        </div>

        <!-- Metrics -->
        <div class="card">
            <h2>Real-time Metrics</h2>
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-value" id="eventsReceived">0</div>
                    <div class="metric-label">Events Received</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="workflowsExecuted">0</div>
                    <div class="metric-label">Workflows Executed</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="tasksCompleted">0</div>
                    <div class="metric-label">Tasks Completed</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="errorCount">0</div>
                    <div class="metric-label">Errors</div>
                </div>
            </div>
        </div>

        <!-- Event Log -->
        <div class="card">
            <h2>Event Log</h2>
            <div class="button-group">
                <button class="btn-secondary" onclick="clearLog()">Clear Log</button>
                <button class="btn-secondary" onclick="exportLog()">Export Log</button>
            </div>
            <div id="eventLog" class="event-log"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let subscriptions = new Set();
        let eventHistory = [];
        let metrics = {
            eventsReceived: 0,
            workflowsExecuted: 0,
            tasksCompleted: 0,
            errorCount: 0
        };

        function updateStatus(status) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');

            statusDot.className = 'status-dot ' + status.toLowerCase();
            statusText.textContent = status;

            if (status === 'Connected') {
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } else {
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        }

        function connect() {
            const url = document.getElementById('wsUrl').value;
            updateStatus('Connecting');

            ws = new WebSocket(url);

            ws.onopen = () => {
                updateStatus('Connected');
                addLog('system', 'Connected to WebSocket server');

                // Send initial ping
                ws.send(JSON.stringify({ type: 'ping' }));
            };

            ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    handleMessage(message);
                } catch (error) {
                    console.error('Failed to parse message:', error);
                    addLog('error', 'Invalid message received');
                }
            };

            ws.onerror = (error) => {
                updateStatus('Error');
                addLog('error', `WebSocket error: ${error.message || 'Unknown error'}`);
            };

            ws.onclose = () => {
                updateStatus('Disconnected');
                addLog('system', 'Disconnected from server');
                ws = null;
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
            }
        }

        function handleMessage(message) {
            metrics.eventsReceived++;
            updateMetrics();

            // Handle different message types
            switch (message.type) {
                case 'pong':
                    addLog('system', 'Received pong');
                    break;

                case 'workflow:started':
                    metrics.workflowsExecuted++;
                    addLog('workflow', `Workflow started: ${message.payload.workflowId}`);
                    break;

                case 'workflow:completed':
                    addLog('workflow', `Workflow completed: ${message.payload.workflowId}`);
                    break;

                case 'task:started':
                    addLog('task', `Task started: ${message.payload.taskId}`);
                    break;

                case 'task:completed':
                    metrics.tasksCompleted++;
                    addLog('task', `Task completed: ${message.payload.taskId}`);
                    break;

                case 'error':
                    metrics.errorCount++;
                    addLog('error', `Error: ${message.payload.message}`);
                    break;

                case 'metrics':
                    addLog('metrics', `Metrics update: ${JSON.stringify(message.payload)}`);
                    break;

                default:
                    addLog(message.type, JSON.stringify(message.payload || message));
            }
        }

        function addLog(type, data) {
            const log = document.getElementById('eventLog');
            const entry = document.createElement('div');
            entry.className = 'event-entry';

            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `
                <span class="event-time">${time}</span>
                <span class="event-type">[${type.toUpperCase()}]</span>
                <div class="event-data">${data}</div>
            `;

            log.insertBefore(entry, log.firstChild);
            eventHistory.push({ time, type, data });

            // Keep only last 100 entries
            if (log.children.length > 100) {
                log.removeChild(log.lastChild);
            }
        }

        function updateMetrics() {
            Object.keys(metrics).forEach(key => {
                const element = document.getElementById(key);
                if (element) {
                    element.textContent = metrics[key];
                }
            });
        }

        function subscribe(channel) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Please connect first');
                return;
            }

            ws.send(JSON.stringify({
                type: 'subscribe',
                payload: { channel }
            }));

            subscriptions.add(channel);
            addLog('system', `Subscribed to ${channel}`);
        }

        function unsubscribeAll() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Please connect first');
                return;
            }

            subscriptions.forEach(channel => {
                ws.send(JSON.stringify({
                    type: 'unsubscribe',
                    payload: { channel }
                }));
            });

            subscriptions.clear();
            addLog('system', 'Unsubscribed from all channels');
        }

        function executeSimpleWorkflow() {
            executeWorkflow({
                name: 'simple-test',
                version: '1.0.0',
                pipeline: [
                    {
                        id: 'task-1',
                        type: 'task',
                        name: 'First Task',
                        agentName: 'code-reviewer',
                        complexity: 'simple'
                    },
                    {
                        id: 'task-2',
                        type: 'task',
                        name: 'Second Task',
                        agentName: 'backend-architect',
                        complexity: 'simple'
                    }
                ]
            });
        }

        function executeParallelWorkflow() {
            executeWorkflow({
                name: 'parallel-test',
                version: '1.0.0',
                pipeline: [
                    {
                        id: 'parallel-stage',
                        type: 'parallel',
                        name: 'Parallel Processing',
                        stages: [
                            { id: 'p1', type: 'task', name: 'Parallel Task 1', agentName: 'code-reviewer' },
                            { id: 'p2', type: 'task', name: 'Parallel Task 2', agentName: 'backend-architect' },
                            { id: 'p3', type: 'task', name: 'Parallel Task 3', agentName: 'issue-detective' }
                        ]
                    }
                ]
            });
        }

        function executeConditionalWorkflow() {
            executeWorkflow({
                name: 'conditional-test',
                version: '1.0.0',
                pipeline: [
                    {
                        id: 'check',
                        type: 'task',
                        name: 'Check Value',
                        agentName: 'test-agent'
                    },
                    {
                        id: 'branch',
                        type: 'conditional',
                        name: 'Decision',
                        condition: 'result.value > 50',
                        then: {
                            id: 'high',
                            type: 'task',
                            name: 'High Value',
                            agentName: 'backend-architect'
                        },
                        else: {
                            id: 'low',
                            type: 'task',
                            name: 'Low Value',
                            agentName: 'code-reviewer'
                        }
                    }
                ]
            });
        }

        function executeCustomWorkflow() {
            try {
                const workflow = JSON.parse(document.getElementById('customWorkflow').value);
                executeWorkflow(workflow);
            } catch (error) {
                alert('Invalid workflow JSON: ' + error.message);
            }
        }

        function executeWorkflow(workflow) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Please connect first');
                return;
            }

            ws.send(JSON.stringify({
                type: 'execute',
                payload: { workflow }
            }));

            addLog('system', `Executing workflow: ${workflow.name}`);
        }

        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });

            // Remove active class from all tab buttons
            document.querySelectorAll('.tab').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(`${tabName}-tab`).classList.add('active');

            // Mark tab button as active
            event.target.classList.add('active');
        }

        function clearLog() {
            document.getElementById('eventLog').innerHTML = '';
            eventHistory = [];
            addLog('system', 'Log cleared');
        }

        function exportLog() {
            const json = JSON.stringify(eventHistory, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `orchestrator-log-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Auto-connect on load (optional)
        // window.onload = () => connect();
    </script>
</body>
</html>
